name: Deploy Pages

on:
  push:
    branches: [main]
    paths: ['docs/site/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy docs/site → Cloudflare Pages (cborweb-com)
        run: npx -y wrangler@latest pages deploy docs/site --project-name cborweb-com --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
